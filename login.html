<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Decibel Band</title>
<meta name="description" content="Log in to Decibel Band.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0908%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22%23e21a2c%22 text-anchor=%22middle%22 font-family=%22Arial Black%22>D</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/redirect-if-auth.js"></script>
</head>
<body>

<div class="auth-shell">
  <div class="card auth-card">
    <div class="auth-logo">
      <a href="login.html" class="logo">DECIBEL<span class="dot">.</span></a>
    </div>
    <h1 data-scramble>Welcome Back</h1>
    <p class="auth-sub">Log in to access Decibel Band.</p>

    <div class="auth-error"></div>

    <form id="login-form">
      <div class="form-row">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

<script src="assets/js/ascii-fx.js"></script>
<script src="assets/js/login-form.js"></script>
</body>
</html>
