<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xtsy*</title>
<meta name="description" content="xtsy*">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000%22/><text x=%2250%22 y=%2270%22 font-size=%2270%22 fill=%22%23ff2bd6%22 text-anchor=%22middle%22 font-family=%22Arial Black%22>*</text></svg>">
<link rel="stylesheet" href="assets/css/xtsy.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/require-auth.js"></script>
</head>
<body>

<div class="xtsy-asterisk-field"></div>
<img class="xtsy-blend-gif" src="assets/img/xtsy-mark.gif" alt="" onerror="this.style.display='none'">

<div class="xtsy-lock-screen" id="xtsy-lock-screen">
  <div class="xtsy-lock-mark">XTSY<span style="color:#fff;">*</span></div>
  <div class="xtsy-lock-sub">private / password required</div>
  <form id="xtsy-lock-form">
    <input type="password" id="xtsy-password" placeholder="PASSWORD" autocomplete="off" required>
    <div class="xtsy-lock-error" id="xtsy-lock-error"></div>
    <button type="submit">Unlock</button>
  </form>
</div>

<div class="xtsy-reveal" id="xtsy-reveal"></div>

<script src="assets/js/xtsy-lock.js"></script>
</body>
</html>
